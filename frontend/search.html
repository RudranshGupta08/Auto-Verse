<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Search Results | AutoVerse</title>

    <link rel="stylesheet" href="assets/css/search.css" />

    <!-- API Configuration -->
    <script src="assets/js/config.js"></script>
  </head>

  <body class="search-page">

    <header class="navbar">
      <h1>🔍 Search Results</h1>
    </header>

    <main id="results"></main>

    <footer>
      <p>© 2025 AutoVerse</p>
    </footer>

    <script>
      const API_BASE = API_BASE_URL;

      const params =
        new URLSearchParams(window.location.search);

      const query =
        params.get("query") || "";

      const container =
        document.getElementById("results");

      if (!query) {

        container.innerHTML =
          "<h2>⚠️ Invalid search</h2>";

        throw new Error("No query");
      }

      // =========================
      // API CALL
      // =========================

      fetch(
        `${API_BASE}/cars/search/${encodeURIComponent(query)}`
      )

        .then((res) => {

          if (!res.ok) {
            throw new Error(
              `Search request failed: ${res.status}`
            );
          }

          return res.json();
        })

        .then((data) => {

          // Handle both array and object responses
          const cars =
            Array.isArray(data)
              ? data
              : data.cars;

          if (!cars || !cars.length) {

            container.innerHTML = `
              <div style="text-align:center; margin-top:60px;">
                <h2 style="color:#ff4d4d;">
                  🚫 No cars found in AutoVerse database
                </h2>

                <p style="color:#ccc;">
                  Try searching another brand or model
                </p>
              </div>
            `;

            return;
          }

          container.innerHTML =
            cars

              .map((car, index) => {

                const format = (val) =>
                  Array.isArray(val)
                    ? val.join(", ")
                    : val || "N/A";

                const rating =
                  Number(car.rating) || 3;

                const stars =
                  "★".repeat(rating) +
                  "☆".repeat(
                    Math.max(0, 5 - rating)
                  );

                return `
                  <div class="section">

                    <div class="car-header">

                      <h1>
                        ${car.brand} ${car.model}
                      </h1>

                      <p class="price">
                        ${car.priceRange || "N/A"}
                      </p>

                      <div class="rating">
                        ${stars}
                      </div>

                    </div>

                    <!-- IMAGE SLIDER -->

                    <div class="image-slider-container">

                      <button
                        class="nav-btn left"
                        data-index="${index}"
                      >
                        ❮
                      </button>

                      <div
                        class="image-slider"
                        id="slider-${index}"
                      >

                        ${
                          (car.images || []).length
                            ? car.images
                                .map(
                                  (img) =>
                                    `<img src="https://auto-verse-hcp5.onrender.com/images/${img}" alt="${car.brand} ${car.model}">`
                                )
                                .join("")
                            : `
                              <img
                                src="https://auto-verse-hcp5.onrender.com/images/placeholder.jpg"
                                alt="No image available"
                              >
                            `
                        }

                      </div>

                      <button
                        class="nav-btn right"
                        data-index="${index}"
                      >
                        ❯
                      </button>

                    </div>

                    <!-- DESCRIPTION -->

                    <div class="section">

                      <h2>Description</h2>

                      <p>
                        ${
                          car.description ||
                          "No description available"
                        }
                      </p>

                    </div>

                    <!-- SPECIFICATIONS -->

                    <div class="section">

                      <h2>Specifications</h2>

                      <p>
                        <strong>Engine:</strong>
                        ${format(car.engineOptions)}
                      </p>

                      <p>
                        <strong>Mileage:</strong>
                        ${car.mileage || "N/A"}
                      </p>

                      <p>
                        <strong>Fuel:</strong>
                        ${format(car.fuelType)}
                      </p>

                      <p>
                        <strong>Transmission:</strong>
                        ${format(car.transmission)}
                      </p>

                      <p>
                        <strong>Seats:</strong>
                        ${car.seatingCapacity || "N/A"}
                      </p>

                      <p>
                        <strong>NCAP:</strong>
                        ${car.ncapRating || "Not Rated"}
                      </p>

                    </div>

                    <!-- FEATURES -->

                    <div class="section">

                      <h2>Features</h2>

                      <ul>
                        ${
                          (car.features || [])
                            .map(
                              (feature) =>
                                `<li>${feature}</li>`
                            )
                            .join("")
                        }
                      </ul>

                    </div>

                    <!-- PROS -->

                    <div class="section">

                      <h2>Pros 👍</h2>

                      <ul>
                        ${
                          (car.pros || [])
                            .map(
                              (pro) =>
                                `<li>${pro}</li>`
                            )
                            .join("")
                        }
                      </ul>

                    </div>

                    <!-- CONS -->

                    <div class="section">

                      <h2>Cons 👎</h2>

                      <ul>
                        ${
                          (car.cons || [])
                            .map(
                              (con) =>
                                `<li>${con}</li>`
                            )
                            .join("")
                        }
                      </ul>

                    </div>

                    <!-- BEST FOR -->

                    <div class="section">

                      <h2>Best For</h2>

                      <ul>
                        ${
                          (car.bestFor || [])
                            .map(
                              (item) =>
                                `<li>${item}</li>`
                            )
                            .join("")
                        }
                      </ul>

                    </div>

                    <!-- VERDICT -->

                    <div class="section">

                      <h2>Verdict</h2>

                      <p>
                        ${
                          car.verdict ||
                          "No verdict available"
                        }
                      </p>

                    </div>

                  </div>
                `;
              })

              .join("");

          // =========================
          // IMAGE SLIDER LOGIC
          // =========================

          document
            .querySelectorAll(".nav-btn")
            .forEach((btn) => {

              btn.addEventListener(
                "click",
                () => {

                  const index =
                    btn.dataset.index;

                  const slider =
                    document.getElementById(
                      `slider-${index}`
                    );

                  let current =
                    slider.dataset.index
                      ? parseInt(
                          slider.dataset.index
                        )
                      : 0;

                  const total =
                    slider.children.length;

                  if (!total) return;

                  if (
                    btn.classList.contains(
                      "left"
                    )
                  ) {

                    current =
                      (current - 1 + total) %
                      total;

                  } else {

                    current =
                      (current + 1) %
                      total;
                  }

                  slider.style.transform =
                    `translateX(-${current * 100}%)`;

                  slider.dataset.index =
                    current;
                }
              );
            });
        })

        .catch((err) => {

          console.error(
            "❌ Search Error:",
            err
          );

          container.innerHTML =
            "<h2>⚠️ Error loading search results</h2>";
        });
    </script>

    <!-- Search JS -->
    <script src="assets/js/search.js"></script>

  </body>
</html>
