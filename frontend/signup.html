<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>User Signup</title>

  <link rel="stylesheet" href="assets/css/signup.css">

  <!-- API Configuration -->
  <script src="assets/js/config.js"></script>
</head>

<body>

  <header>
    <div class="logo">

      <img
        src="assets/images/Autoverselogo.png"
        alt="Auto Verse Logo"
        class="logo-img"
      >

      <span>Auto Verse</span>

    </div>
  </header>


  <div class="signup-container">

    <h2>Create an Account</h2>

    <form
      id="signupForm"
      class="signup-form"
    >

      <div class="form-group">

        <label for="username">
          Choose Username
        </label>

        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter username"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Choose Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter password"
          minlength="8"
          maxlength="72"
          autocomplete="new-password"
          required
        >

      </div>


      <button
        type="submit"
        class="btn"
      >
        Signup
      </button>


      <p class="login-link">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </p>

    </form>

  </div>


  <!-- =========================
       SIGNUP SCRIPT
  ========================== -->

  <script>
    (() => {
      "use strict";

      const form = document.getElementById("signupForm");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const button = form?.querySelector("button[type=submit]");
      const API = String(API_BASE_URL || "").replace(/\/+$/, "");

      let csrfToken = null;

      async function getCsrfToken(force = false) {
        if (csrfToken && !force) return csrfToken;

        const response = await fetch(`${API}/auth/csrf`, {
          credentials: "include",
          headers: { Accept: "application/json" },
          cache: "no-store"
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok || typeof data.csrfToken !== "string") {
          throw new Error("Unable to establish a secure signup session.");
        }

        csrfToken = data.csrfToken;
        return csrfToken;
      }

      async function signup() {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (username.length < 3 || username.length > 50) {
          throw new Error("Username must contain 3–50 characters.");
        }

        if (password.length < 8 || password.length > 72) {
          throw new Error("Password must contain 8–72 characters.");
        }

        const token = await getCsrfToken();

        const response = await fetch(`${API}/auth/signup`, {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json",
            "X-CSRF-Token": token
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json().catch(() => ({}));

        if (response.status === 403 && /security token|origin/i.test(String(data.message || ""))) {
          csrfToken = null;
          const fresh = await getCsrfToken(true);
          return fetch(`${API}/auth/signup`, {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
              "X-CSRF-Token": fresh
            },
            body: JSON.stringify({ username, password })
          }).then(async retry => ({ response: retry, data: await retry.json().catch(() => ({})) }));
        }

        return { response, data };
      }

      getCsrfToken().catch(error => console.warn("CSRF initialization failed:", error));

      form?.addEventListener("submit", async event => {
        event.preventDefault();
        if (button) button.disabled = true;

        try {
          const result = await signup();

          if (!result.response.ok) {
            throw new Error(result.data.message || "Signup failed.");
          }

          alert(result.data.message || "Signup successful!");
          window.location.replace("login.html");
        } catch (error) {
          console.error("Signup error:", error);
          alert(error.message || "Unable to create account. Please try again.");
        } finally {
          if (button) button.disabled = false;
        }
      });
    })();
  </script>

</body>

</html>
